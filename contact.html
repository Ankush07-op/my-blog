<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us - My Blog</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <a href="index.html" class="logo">
            <i class="fa-solid fa-code"></i> My Blog
        </a>

        <nav>
            <a href="index.html"><i class="fa fa-home"></i> Home</a>
            <a href="about.html"><i class="fa fa-user"></i> About</a>
            <a href="contact.html" class="active"><i class="fa fa-envelope"></i> Contact</a>
            <a href="admin.html"><i class="fa fa-shield-halved"></i> Admin</a>
        </nav>

        <button id="themeToggleBtn" class="theme-toggle-btn" onclick="toggleDarkMode()">
            <i class="fa fa-moon"></i> Dark Mode
        </button>
    </header>

    <main class="container">
        <div class="card-box">
            <h2><i class="fa fa-paper-plane" style="color:var(--accent-primary)"></i> Get In Touch</h2>
            <p>Have questions, feedback, or guest post inquiries? Fill out the form below to send me a message directly!</p>

            <form id="contactForm" onsubmit="return validateForm(event)">
                <div style="margin-bottom:1.2rem;">
                    <label for="name" style="font-weight:600; display:block; margin-bottom:0.4rem;">Your Name</label>
                    <input type="text" id="name" class="form-control" placeholder="Enter your full name" required>
                </div>

                <div style="margin-bottom:1.2rem;">
                    <label for="email" style="font-weight:600; display:block; margin-bottom:0.4rem;">Email Address</label>
                    <input type="email" id="email" class="form-control" placeholder="name@example.com" required>
                </div>

                <div style="margin-bottom:1.5rem;">
                    <label for="message" style="font-weight:600; display:block; margin-bottom:0.4rem;">Your Message</label>
                    <textarea id="message" class="form-control" placeholder="Type your message here..." required></textarea>
                </div>

                <button type="submit" class="btn-primary" style="width:100%;">
                    <i class="fa fa-paper-plane"></i> Send Message
                </button>
            </form>
        </div>
    </main>

    <footer>
        <p>&copy; 2026 My Blog | Designed with Node.js & MongoDB</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
